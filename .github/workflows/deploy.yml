name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required.
      # If D1_DATABASE_ID is not set, the workflow creates the D1 database automatically.
      # Optional: SECURE_DOMAINS (CORS allowlist) and SITE_URL (your site URL).
      - name: Prepare D1 database and generate wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SECURE_DOMAINS: ${{ secrets.SECURE_DOMAINS }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "No D1_DATABASE_ID secret found, creating database waline-db..."
            CREATE_OUT=$(npx wrangler d1 create waline-db 2>&1 || true)
            D1_DATABASE_ID=$(echo "$CREATE_OUT" | grep -oP 'database_id\s*=\s*"\K[^"]+' | head -1)
            if [ -z "$D1_DATABASE_ID" ]; then
              echo "Database waline-db may already exist, looking up its ID..."
              D1_DATABASE_ID=$(npx wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; dbs=json.load(sys.stdin); print(next((d['uuid'] for d in dbs if d['name']=='waline-db'), ''))")
            fi
            if [ -z "$D1_DATABASE_ID" ]; then
              echo "$CREATE_OUT"
              echo "::error::Could not create or find D1 database. Make sure your API token has D1 edit permission, or add a D1_DATABASE_ID secret with an existing database ID."
              exit 1
            fi
            echo "D1 database ready: $D1_DATABASE_ID"
          fi
          sed "s/YOUR_CLOUDFLARE_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.toml.example > wrangler.toml
          if [ -n "$SECURE_DOMAINS" ]; then
            sed -i "s|^# SECURE_DOMAINS = .*|SECURE_DOMAINS = \"${SECURE_DOMAINS}\"|" wrangler.toml
          fi
          if [ -n "$SITE_URL" ]; then
            sed -i "s|^# SITE_URL = .*|SITE_URL = \"${SITE_URL}\"|" wrangler.toml
          fi
          cat wrangler.toml
          echo "Initializing database schema (idempotent)..."
          npx wrangler d1 execute waline-db --remote --file=./schema.sql 2>/dev/null || npx wrangler d1 execute "$D1_DATABASE_ID" --remote --file=./schema.sql

      - name: Set JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET=$(openssl rand -hex 32)
            echo "Warning: JWT_SECRET not set, generated a random one. Logins will reset on every deploy. Add a JWT_SECRET secret to keep sessions stable."
          fi
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
