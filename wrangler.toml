#:schema node_modules/wrangler/config-schema.json

name = "waline-on-worker"
main = "src/index.ts"
compatibility_date = "2026-06-03"

[vars]
# Restrict CORS access to specific domains (comma-separated, no http://)
SECURE_DOMAINS = "902786.xyz"
